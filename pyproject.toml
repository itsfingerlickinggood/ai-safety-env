[project]
name = "hud-optstop-core-reproduction"
version = "0.3.0"
description = "HUD environments for AI-safety monitoring regression and bounded paper reproduction"
requires-python = "==3.12.*"
dependencies = [
  "hud==0.6.15",
  "arviz==0.23.4",
  "matplotlib==3.9.4",
  "numba==0.60.0",
  "numpy==1.26.4",
  "pandas==2.3.3",
  "pydantic==2.13.4",
  "pymc==5.25.1",
  "pypdf==6.17.0",
  "scipy==1.14.1",
  "tqdm==4.68.2",
]

[tool.hud]
image = "optstop-core-reproduction-v1"
